services:
  # code-server + Prometheus + Pushgateway + pedidos-exporter
  prometheus-lab:
    container_name: prometheus-lab
    image: ghcr.io/labzinho/prometheus-lab-docker-image:latest
    ports:
      - "8080:8080"
      - "9090:9090"

  # Grafana com o datasource do Prometheus pré-configurado
  grafana:
    container_name: grafana
    image: grafana/grafana:13.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
    depends_on:
      - prometheus-lab
